name: Release

# SwiftPM distributes by git tag — there is no registry to push to. Pushing a
# semver tag verifies the build and cuts a GitHub Release with generated notes.
# Uses the built-in GITHUB_TOKEN, so no extra secret is needed.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write # create releases

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify build & tests
        run: swift test
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
